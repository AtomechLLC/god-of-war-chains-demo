# Deploy the public site for the GoW1 Chains demo to GitHub Pages.
#
# The site ships: a landing page, the kratos-lab viewer, the git-tracked
# assets/ curated subset the viewer loads (~10 MB — the full extracted/ set
# stays local-only/gitignored), and the designer .twk sheets (including the
# decoded design/twk/decoded/ exports).
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r tools _site/tools
          cp -r design _site/design
          cp -r assets _site/assets
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
